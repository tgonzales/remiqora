name: NiX desktop app

# The NiX Studio installers: upstream's desktop.yml with the brand applied before packaging. A tag nix-vX.Y.Z-N
# (upstream's desktop version, then our build number) also creates a DRAFT pre-release. The tag prefix is not
# "v" on purpose: upstream's own workflow reacts to v* and would publish its unbranded installers next to ours.
on:
  workflow_dispatch:
  push:
    tags: ["nix-v*"]

permissions:
  contents: read

concurrency:
  group: nix-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifacts: |
              desktop/dist/*.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      # upstream's tests describe upstream's files, so they run before the brand rewrites them
      - name: Unit tests
        run: npm test
        working-directory: desktop
      - name: Apply the brand
        run: |
          node brand/check.mjs
          node brand/apply.mjs
      - name: Build installer
        run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
      - name: No upstream name left in what ships
        run: node brand/check.mjs --dist desktop/resources/frontend/dist
      - name: Verify the ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/NiX Studio.app"
          codesign --display --verbose=2 "dist/mac-arm64/NiX Studio.app"
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: nix-studio-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/nix-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the desktop version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          case "$GITHUB_REF_NAME" in
            "nix-v$version"|"nix-v$version-"*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not start with nix-v$version (desktop/package.json)" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          NiX Studio desktop installers for Windows (NVIDIA GPU) and macOS (Apple Silicon). NiX Studio is based on Remiqora (MIT).

          - They have no certificate yet. Windows shows a SmartScreen warning ("More info" → "Run anyway"); on macOS allow the app once via System Settings → Privacy & Security → "Open Anyway".
          - The installer is small: the first launch asks what to install and downloads it into a folder you choose.
          - SHA-256 sums of every file are in `SHA256SUMS.txt`.
          NOTES
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --prerelease \
              --title "NiX Studio ${GITHUB_REF_NAME#nix-v}" --notes-file notes.md
          fi
