name: NiX ACE-Step image

# Builds the RunPod Serverless worker for ACE-Step (brand/scripts/runpod/serverless) and pushes it to GHCR as
# ghcr.io/<owner>/nix-ace-step:<commit> and :latest. brand/scripts/runpod-serverless.py deploys it.
on:
  workflow_dispatch:
    inputs:
      ace:
        description: "latest: ACE-Step's newest commit if the studio's patch applies (else the tested one). pinned: the tested one."
        type: choice
        options: [latest, pinned]
        default: latest
  push:
    branches: ["nix/**"]
    paths:
      - brand/scripts/runpod/serverless/**
      - external/patches/ace-step.patch
      - .github/workflows/nix-ace-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: nix-ace-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push the ACE-Step worker
    runs-on: ubuntu-latest
    steps:
      - name: Make room (PyTorch for CUDA is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - name: The ACE-Step commit the studio was tested with
        id: ace
        run: |
          ref="$(sed -nE 's/^ACE_STEP_REF="\$\{ACE_STEP_REF:-([0-9a-f]{7,40})\}".*/\1/p' setup_linux.sh)"
          [ -n "$ref" ] || { echo "ACE_STEP_REF not found in setup_linux.sh"; exit 1; }
          echo "pinned=$ref" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix-ace-step" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: brand/scripts/runpod/serverless/Dockerfile
          build-args: |
            ACE_MODE=${{ inputs.ace || 'latest' }}
            ACE_PINNED=${{ steps.ace.outputs.pinned }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ACE-Step 1.5 with the NiX Studio patch, as a RunPod Serverless worker
          tags: |
            ${{ steps.ace.outputs.image }}:${{ github.sha }}
            ${{ steps.ace.outputs.image }}:latest
          push: true
